org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.disallowKotlinSourceSets=false

# NO se fija aqui `org.gradle.java.home`. Es una ruta especifica de cada
# maquina y no debe viajar en el repositorio. Pasa el JDK en la invocacion:
#
#   ./gradlew -Dorg.gradle.java.home=/usr/lib/jvm/java-27-openjdk :app:assembleDebug
#
# En este entorno, JDK 27.
