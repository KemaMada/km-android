org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# NO se fija aqui `org.gradle.java.home`. Es una ruta especifica de cada
# maquina y no debe viajar en el repositorio: hardcodearla rompe el clon de
# cualquiera que tenga el JDK en otra ruta, y en CI. Pasa el JDK en la
# invocacion:
#
#   ./gradlew -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk :app:assembleDebug
#
# Requisito de este build: JDK 17 (AGP 8.5.0 + Kotlin 2.1.20).
