[versions]
# AGP 8.5.x is the floor for the integrated Kotlin 2.x Compose compiler plugin.
agp = "8.5.0"
kotlin = "2.1.20"
# Version of the Compose compiler Gradle plugin. MUST match the Kotlin version:
# with Kotlin 2.x the compiler ships inside the Kotlin plugin, so the
# `org.jetbrains.kotlin.plugin.compose` marker is versioned in lockstep with KGP.
kotlinCompose = "2.1.20"
coreKtx = "1.12.0"
appcompat = "1.6.1"
activityCompose = "1.8.0"
lifecycle = "2.7.0"
navigationCompose = "2.7.5"
# Compose artifacts are pinned to a BOM so ui/material3/icons never disagree.
composeBom = "2024.09.03"
room = "2.7.0-alpha02"
kotlinxCoroutines = "1.7.3"
okhttp = "4.12.0"
# MockWebServer must track okhttp exactly: it is compiled against okhttp's
# internal WebSocket classes, and a skew shows up as a NoSuchMethodError at
# runtime, not at compile time.
mockwebserver = "4.12.0"
okio = "3.5.0"
# org.json is stubbed ("not mocked") in JVM unit tests, so the real
# implementation is needed on the unit-test classpath for RelayClient /
# RelayDataCodec to run off-device.
orgjson = "20240303"
webrtc-java = "125.6422.07"
zxingAndroid = "4.3.0"
zxingCore = "3.5.2"
securityCrypto = "1.1.0-alpha03"
jackson = "2.15.2"
junit = "4.13.2"
junitJupiter = "5.10.0"
mockito = "5.5.0"
mockitoKotlin = "5.1.0"
espresso = "3.5.1"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinKapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# BOM: constrain, never pin individual Compose artifacts. `version.ref` on a BOM
# alias used to be copied into ui/material3 aliases, which is why Compose pieces
# drifted apart (ui 1.5.1 vs material3 1.1.2).
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
# Android WebRTC AAR. NOT dev.onvoid.webrtc:webrtc-java — that artifact is the
# desktop/JVM build (dev.onvoid.webrtc.* packages, linux-x86_64 natives) and
# provides no org.webrtc.* classes at all.
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc-java" }
zxing-android = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingAndroid" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "espresso" }

[bundles]
androidx-compose = ["androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3", "androidx-material-icons-extended"]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "androidx-activity-compose", "androidx-lifecycle-runtime-ktx"]
androidx-navigation = ["androidx-navigation-compose"]
androidx-lifecycle = ["androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel-compose"]
androidx-room = ["androidx-room-runtime", "androidx-room-ktx", "androidx-room-compiler"]
kotlinx-coroutines = ["kotlinx-coroutines-android", "kotlinx-coroutines-core"]
testing = ["junit", "junit-jupiter", "mockito-core", "mockito-kotlin", "okhttp-mockwebserver", "orgjson"]
android-test = ["androidx-test-junit", "espresso-core"]
